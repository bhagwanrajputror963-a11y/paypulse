services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paypulse_development
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: paypulse_development
      DB_NAME_TEST: paypulse_test
      RAILS_ENV: development
      RAILS_MAX_THREADS: "5"
      CORS_ORIGINS: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - bundle_data:/usr/local/bundle
    command: ["sh", "-c", "bundle exec rails db:prepare && bundle exec rails db:seed && bundle exec rails server -b 0.0.0.0"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  pgdata:
  bundle_data:
